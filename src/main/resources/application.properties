server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

llm.api-key=${LLM_API_KEY}
llm.url=https://integrate.api.nvidia.com/v1/chat/completions
llm.model=mistralai/mistral-large-4-1t-a52b

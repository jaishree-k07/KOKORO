
server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# LLM configuration
llm.api-key=${LLM_API_KEY}
llm.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
llm.model=gemini-3.8-flash

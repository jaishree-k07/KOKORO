server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/kokoro?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# LLM (any OpenAI-compatible chat completions endpoint). Set LLM_API_KEY as an environment variable.
llm.api-key=${LLM_API_KEY}
llm.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
llm.model=gemini-3.8-flash


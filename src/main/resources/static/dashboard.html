<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <title>Kokoro Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: #E6D9FF;
      display: flex;
      overflow-x: hidden; /* Prevents horizontal scroll */
    }
    .sub-tab {
      padding-left: 40px;
      font-size: 16px;
      color: #eee;
      margin: 10px 0;
      cursor: pointer;
      display: none; /* Hidden until "Lets Talk" is clicked */
    }
    .sub-tab:hover { color: white; text-decoration: underline; }
    /* SIDEBAR */
    .sidebar {
      width: 280px;
      background: #9C7CFF;
      color: white;
      padding: 35px 25px;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .sidebar h2 { font-size: 32px; margin-bottom: 40px; }

    .tab {
      font-size: 20px;
      margin: 25px 0;
      cursor: pointer;
    }

    /* MAIN CONTENT AREA */
    .main {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }

    /* CHATBOT CONTAINER (Right Side) */
    #chatbot-container {
      display: none; /* Hidden by default */
      flex: 1;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
      margin-top: 20px;
      height: 80vh; /* Adjust height as needed */
    }

    /* Hide dashboard cards when chat is active */
    .dashboard-content.hidden {
      display: none;
    }

    /* EXISTING CARD STYLES */
    .top-cards { display: flex; gap: 40px; flex-wrap: wrap; }
    .card {
      background: white;
      border-radius: 20px;
      padding: 35px;
      width: 320px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
      text-align: center;
    }
    .card img { width: 160px; cursor: pointer; margin-top: 10px; }
    .streak-number { font-size: 60px; font-weight: bold; color: #9C7CFF; }

    .motivation {
      margin-top: 40px;
      background: #FFFFFF;
      padding: 30px;
      border-radius: 20px;
      max-width: 700px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .calendar {
      margin-top: 40px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 500px;
    }
    .days { display: flex; justify-content: space-between; margin-top: 20px; }
    .day { padding: 15px; border-radius: 50%; width: 55px; text-align: center; }
    .today { background: #9C7CFF; color: white; font-weight: bold; }

    #chat-panel { height: 100%; display: flex; flex-direction: column; }
    #chat-header { background: #9C7CFF; color: white; padding: 15px 20px; font-size: 18px; font-weight: 600; }
    #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #F8F4FF; }
    .bubble { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
    .bubble.user { align-self: flex-end; background: #9C7CFF; color: white; border-bottom-right-radius: 4px; }
    .bubble.assistant { align-self: flex-start; background: white; color: #2c2c2c; box-shadow: 0 2px 6px rgba(0,0,0,0.08); border-bottom-left-radius: 4px; }
    .bubble.crisis { background: #FFE5E5; border: 1px solid #C0392B; }
    #chat-input { display: flex; gap: 10px; padding: 15px; background: white; }
    #chat-input input { flex: 1; padding: 12px 16px; border-radius: 25px; border: 1px solid #ddd; font-size: 15px; outline: none; }
    #chat-input button { padding: 12px 26px; border: none; border-radius: 25px; background: #9C7CFF; color: white; font-size: 15px; cursor: pointer; }
  </style>
</head>

<body>

<div class="sidebar">
  <h2>Kokoro 🌸</h2>
  <div class="tab" onclick="showDashboard()">✨ You</div>
  
  <div class="tab" onclick="toggleMenu()">✨ Lets Talk</div>
  <div class="sub-tab chat-link" onclick="loadBot('kelly')"> Kelly (Comforting)</div>
  <div class="sub-tab chat-link" onclick="loadBot('hannah')"> Hannah (Advice)</div>
  <div class="sub-tab chat-link" onclick="loadBot('darbie')"> Darbie (Sarcastic)</div>

  <a href="dear-diary.html" style="text-decoration: none; color: inherit;">
    <div class="tab">✨ Dear Diary</div>
  </a>
  <a href="little-wins.html" style="text-decoration: none; color: inherit;">
    <div class="tab">✨ Little Wins</div>
  </a>
  <a href="achievements.html" style="text-decoration:none; color:inherit;">
    <div class="tab">🏆 Achievements</div>
  </a>
  <div class="tab" onclick="logout()">🚪 Logout</div>
</div>

<div class="main">

  <div id="chatbot-container">
    <div id="chat-panel">
      <div id="chat-header">Pick someone to talk to 💬</div>
      <div id="chat-messages"></div>
      <div id="chat-input">
        <input id="chatMsg" placeholder="Type a message..." autocomplete="off">
        <button onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

  <div id="dashboard-view" class="dashboard-content">
    <div class="top-cards">
      <div class="card">
        <h3>Mood Jar</h3>
        <img src="/images/moodjar.png" onclick="goToMoodJar()">
        <p style="font-size:18px;">Tap to log today’s feeling</p>
      </div>

      <div class="card">
        <h3>Your Streak 🔥</h3>
        <div class="streak-number" id="streakCount">0</div>
        <p style="font-size:18px;">days of showing up</p>
      </div>
    </div>

    <div class="motivation">
      <h2>💜 Motivation for Today</h2>
      <p id="quote"></p>
    </div>

    <div class="calendar">
      <h3>This Week</h3>
      <div class="week-days" id="weekDays" style="display: flex; justify-content: space-between;"></div>
    </div>
    
  </div>

</div>

<script src="js/api.js"></script>
<script>

requireLogin();

function toggleMenu() {
  let subs = document.getElementsByClassName('sub-tab');
  for (let s of subs) s.style.display = (s.style.display === 'block') ? 'none' : 'block';
}

/* ----- native chat panel (talks to /api/chat) ----- */
let currentBot = null;
const botNames = { kelly: "Kelly 💗 (Comforting)", hannah: "Hannah ✅ (Advice)", darbie: "Darbie ✨ (Sarcastic)" };
const greetings = {
  kelly: "Hi, I'm Kelly. I'm here to listen. How are you feeling? 💗",
  hannah: "Hi, I'm Hannah. Tell me what's on your mind and we'll work out a next step. ✅",
  darbie: "Oh look, a human! I'm Darbie. What's going on? ✨"
};
const box = document.getElementById("chat-messages");

function addBubble(role, text) {
  const d = document.createElement("div");
  d.className = "bubble " + role;
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

async function loadBot(botName) {
  document.getElementById('dashboard-view').style.display = 'none';
  document.getElementById('chatbot-container').style.display = 'block';
  currentBot = botName;
  document.getElementById("chat-header").textContent = botNames[botName];
  box.innerHTML = "";
  try {
    const history = await API.get("/api/chat/history?persona=" + botName);
    if (history.length === 0) addBubble("assistant", greetings[botName]);
    history.forEach(m => addBubble(m.role, m.message));
  } catch (e) { addBubble("assistant", greetings[botName]); }
}

async function sendChat() {
  if (!currentBot) return;
  const input = document.getElementById("chatMsg");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  addBubble("user", text);
  const typing = addBubble("assistant", "…");
  try {
    const r = await API.post("/api/chat", { persona: currentBot, message: text });
    typing.textContent = r.reply;
    if (r.crisis) typing.classList.add("crisis");
  } catch (e) { typing.textContent = "Sorry, something went wrong. Please try again."; }
  box.scrollTop = box.scrollHeight;
}
document.getElementById("chatMsg").addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

function showDashboard() {
  document.getElementById('dashboard-view').style.display = 'block';
  document.getElementById('chatbot-container').style.display = 'none';
}

function goToMoodJar() { window.location.href = "mood-jar.html"; }

/* ----- streak & quotes ----- */
API.get("/api/streak").then(r => { document.getElementById("streakCount").innerText = r.streak; }).catch(() => {});

const quotes = ["Small steps still move you forward 💫", "It’s okay to rest. You’re still growing 🌱", "One gentle day at a time ✨"];
document.getElementById("quote").innerText = quotes[Math.floor(Math.random() * quotes.length)];

/* ----- week highlight ----- */
const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const todayIndex = new Date().getDay();
const container = document.getElementById("weekDays");
days.forEach((day, i) => {
  const d = document.createElement("div");
  d.className = "day";
  d.innerText = day;
  if (i === todayIndex) d.classList.add("today");
  container.appendChild(d);
});

</script>

</body>
</html>

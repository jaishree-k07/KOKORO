<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
  <title>Login – Kokoro</title>
  <style>
    body {
      background-color: #E6D9FF;
      font-family: Arial;
      text-align: center;
      padding-top: 80px;
    }
    .card {
      background: white;
      width: 320px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
    }
    input, button {
      width: 90%;
      padding: 8px;
      margin: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #9C7CFF;
      color: white;
      border: none;
    }
  </style>
</head>

<body>
  <div class="card">
    <img src="/images/penguin.png" width="100"><br><br>
    <h3>Login</h3>

    <input type="text" id="loginUser" placeholder="Username">
    <input type="password" id="loginPass" placeholder="Password">

    <button onclick="login()">Login</button>

    <p>New here? <a href="signup.html">Sign up</a></p>
  </div>

<script src="js/api.js"></script>
<script>

async function login() {
  const username = document.getElementById("loginUser").value;
  const password = document.getElementById("loginPass").value;
  try {
    const r = await API.post("/api/auth/login", { username, password });
    localStorage.setItem("kokoroToken", r.token);
    localStorage.setItem("kokoroUser", r.username);
    window.location.href = r.checkedIn ? "dashboard.html" : "home.html";
  } catch (e) { alert(e.message); }
}

</script>

</body>
</html>
